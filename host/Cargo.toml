[package]
name = "doskrunch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-platform CLI that produces self-extracting DOS .EXE files with CPU-tier-optimized decompressors. (.COM output planned for a later phase.)"

[[bin]]
name = "doskrunch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
crc32fast = "1.4"
# libc gives us `O_NOFOLLOW` for pack.rs's no-follow input read on
# unix targets. Already in our transitive dep set; promoted to a
# direct dep so the use is explicit.
libc = "0.2"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile = "3"
flate2 = "1.0"
filetime = "0.2"
libc = "0.2"
