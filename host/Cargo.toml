[package]
name = "doskrunch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-platform CLI that produces self-extracting DOS .EXE files with CPU-tier-optimized decompressors. (.COM output planned for a later phase.)"

[[bin]]
name = "doskrunch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
crc32fast = "1.4"
# libc gives us `O_NOFOLLOW` for pack.rs's no-follow input read on
# unix targets. Already in our transitive dep set; promoted to a
# direct dep so the use is explicit.
libc = "0.2"
# Host-side LZMA encoder (Apache-2.0, pure Rust). The stub-side
# decoder is C code vendored under `vendor/xz-embedded` and built
# via `build.rs`. lzma-rust's `LZMAWriter::new_no_header` emits a
# raw LZMA1 stream (no 13-byte properties header, no EOS marker),
# which we then convert to xz-embedded's MicroLZMA format on a
# per-chunk basis — see `host/src/compress/lzma.rs`.
lzma-rust = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile = "3"
flate2 = "1.0"
filetime = "0.2"
libc = "0.2"
