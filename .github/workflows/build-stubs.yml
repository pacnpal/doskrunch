name: build-stubs

on:
  push:
    paths:
      - "stubs/src/**"
      - "stubs/blobs/*.bin"
      - "stubs/Makefile"
      - "stubs/Dockerfile"
      - "vendor/xz-embedded/**"
      - ".github/workflows/build-stubs.yml"
  pull_request:
    paths:
      - "stubs/src/**"
      - "stubs/blobs/*.bin"
      - "stubs/Makefile"
      - "stubs/Dockerfile"
      - "vendor/xz-embedded/**"
      - ".github/workflows/build-stubs.yml"
  workflow_dispatch:

# Principle of least privilege: GITHUB_TOKEN gets read-only access to
# the repo (enough for actions/checkout). Artifacts use the
# upload-artifact action's own ephemeral storage, not Packages.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Watcom container
        run: docker build -t doskrunch-watcom stubs/

      - name: Build stub blobs
        # Run as the runner user, not root, so the mounted source
        # tree doesn't end up with root-owned files that break the
        # diff/upload steps below (or trip up contributors running
        # the same command locally). Phase 5 mounts the project
        # ROOT (not just stubs/) because the LZMA stub variants
        # compile xz-embedded straight from vendor/xz-embedded/;
        # the Makefile references those via `../vendor/...` while
        # running from /work/stubs.
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work/stubs doskrunch-watcom make all

      # Upload the rebuilt blobs FIRST. The drift check below fails for
      # any source-side change until the matching blob is committed —
      # we still want the artifact in hand so PR authors can pull the
      # new blob and commit it without having to install Watcom locally.
      - name: Upload stub blobs
        uses: actions/upload-artifact@v7
        with:
          name: stubs-blobs
          path: stubs/blobs/*.bin
          if-no-files-found: error

      - name: Verify committed blob matches the rebuild
        run: |
          # If anything under stubs/blobs/ drifted, fail so the PR author
          # is forced to commit the rebuild. include_bytes! in the Rust
          # host pins us to the on-disk copy.
          git diff --exit-code -- stubs/blobs/
