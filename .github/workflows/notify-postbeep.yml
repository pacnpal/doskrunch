# Fires a repository_dispatch on pacnpal/POSTBEEPNET so POSTBEEP.NET rebuilds the
# catalog when this project changes its manifest or cuts a release. See
# docs/ADDING_A_PROJECT.md on the hub repo for the POSTBEEP_DISPATCH_PAT
# setup. Generated by postbeep-init; safe to edit, but the hub expects
# the `project-update` event type.
name: Notify POSTBEEP.NET

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['.postbeep/**']
  workflow_dispatch:

# The job uses POSTBEEP_DISPATCH_PAT (set as a repo secret) instead of
# the default GITHUB_TOKEN, so we drop the default permissions to nil
# rather than leaving them at the repo default. A future tweak to the
# step won't accidentally rely on broader scopes.
permissions: {}

# Collapse rapid-fire dispatches per event kind. A release publish
# often coincides with a push to .postbeep/** in the same commit
# (e.g., bumping a version in the manifest in the same commit
# that's tagged); keying the group on event_name means the release
# run and the push run go through separate concurrency groups so a
# late-arriving release event can't cancel the push run that's
# carrying the manifest change, and vice versa. Within ONE event
# kind, near-simultaneous dispatches still collapse.
#
# UX note: cancel-in-progress means the earlier of two
# same-event-kind dispatches shows up as 'cancelled' in this repo's
# Actions tab. That looks like a failure at a glance — it isn't,
# the later run still dispatches successfully. Set
# cancel-in-progress: false if you'd rather queue than cancel.
concurrency:
  group: notify-postbeep-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    # Bounded so a stuck `gh api` call doesn't tie up a runner slot
    # for the org-default 6 hours.
    timeout-minutes: 5
    steps:
      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.POSTBEEP_DISPATCH_PAT }}
          PROJECT: ${{ github.event.repository.name }}
          OWNER:   ${{ github.repository_owner }}
          RELEASE: ${{ github.event.release.tag_name || '' }}
          REF:     ${{ github.sha }}
          REASON:  ${{ github.event_name }}
        run: |
          # Skip cleanly (not a red run) when the dispatch PAT isn't
          # configured — e.g. on a fork, or before the secret is set up —
          # so the repo doesn't accumulate noisy failed Actions runs.
          if [ -z "$GH_TOKEN" ]; then
            echo "POSTBEEP_DISPATCH_PAT secret not set; skipping POSTBEEP.NET dispatch."
            exit 0
          fi
          # gh CLI is preinstalled on ubuntu-latest. Build the payload
          # with jq so values are JSON-encoded safely (a tag like
          # `v1.0"weird"` would otherwise corrupt a string-interpolated
          # JSON body and 4xx the request).
          jq -n \
            --arg project "$PROJECT" \
            --arg owner "$OWNER" \
            --arg release "$RELEASE" \
            --arg ref "$REF" \
            --arg reason "$REASON" \
            '{event_type: "project-update", client_payload: {project: $project, owner: $owner, release: $release, ref: $ref, reason: $reason}}' \
            | gh api \
              repos/pacnpal/POSTBEEPNET/dispatches \
              --method POST \
              --input -
